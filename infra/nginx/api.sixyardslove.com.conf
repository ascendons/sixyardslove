# /etc/nginx/sites-available/api.sixyardslove.com
# Symlink: sudo ln -s /etc/nginx/sites-available/api.sixyardslove.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name api.sixyardslove.com;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.sixyardslove.com;

    # ── SSL (Certbot will fill these in) ──────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.sixyardslove.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sixyardslove.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         DENY;
    add_header X-XSS-Protection        "1; mode=block";

    # Allow large request bodies for bulk upload endpoints
    client_max_body_size 50M;

    # ── Proxy to Spring Boot (port 8081) ──────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — increased for bulk upload/processing
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # Buffer tweaks for JSON APIs
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # ── Health check endpoint (no auth required) ──────────────────────────────
    location /actuator/health {
        proxy_pass http://127.0.0.1:8081/actuator/health;
        access_log off;
    }
}
