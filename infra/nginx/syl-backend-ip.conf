# /etc/nginx/sites-available/syl-backend
# For use WITHOUT a domain — serves on EC2 public IP.
# Automatically installed by ec2-bootstrap.sh
#
# If you add a domain later, use api.sixyardslove.com.conf instead
# and run: sudo certbot --nginx -d api.yourdomain.com

server {
    listen 80 default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # All API traffic → Spring Boot on port 8081
    location /api/ {
        proxy_pass         http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # Health check (useful for load balancer probes)
    location /health {
        proxy_pass  http://127.0.0.1:8081/actuator/health;
        access_log  off;
    }

    location / {
        return 200 'Six Yards Love backend OK';
        add_header Content-Type text/plain;
    }
}
